name: Core ML window packing smoke

on:
  workflow_dispatch:
  push:
    branches: [neural-convert-diagnostics]
    paths:
      - '.github/workflows/window-coreml-smoke.yml'
      - 'PortTools/mlxdlss/model.py'

permissions:
  contents: read

concurrency:
  group: window-coreml-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conversion tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' 'coremltools==9.0' numpy
      - name: Verify packing equivalence and Core ML conversion
        run: |
          set -euo pipefail
          PYTHONPATH=PortTools python - <<'PY'
          import numpy as np
          import torch
          from torch import nn
          import coremltools as ct
          from mlxdlss.model import partition_windows, reverse_windows

          class RoundTrip(nn.Module):
              def forward(self, value):
                  windows = partition_windows(value, 8)
                  return reverse_windows(
                      windows,
                      batch_count=value.shape[0],
                      height=value.shape[1],
                      width=value.shape[2],
                      window_size=8,
                  )

          model = RoundTrip().eval()
          example = torch.arange(1 * 128 * 128 * 32, dtype=torch.float32).reshape(1, 128, 128, 32)
          with torch.inference_mode():
              eager = model(example)
          torch.testing.assert_close(eager, example, rtol=0, atol=0)
          print('EAGER_ROUNDTRIP_EXACT', flush=True)

          with torch.inference_mode():
              exported = torch.export.export(model, (example,), strict=True).run_decompositions({})

          high = []
          max_rank = 0
          for node in exported.graph_module.graph.nodes:
              value = node.meta.get('val')
              shape = getattr(value, 'shape', None)
              if shape is None:
                  continue
              rank = len(shape)
              max_rank = max(max_rank, rank)
              if rank > 5:
                  high.append((node.name, str(node.target), tuple(shape)))
          print('MAX_EXPORTED_RANK', max_rank, flush=True)
          print('RANK_GT_5_COUNT', len(high), flush=True)
          if high:
              for row in high[:20]:
                  print('RANKGT5', row, flush=True)
              raise SystemExit('window packing still exports rank > 5')

          converted = ct.convert(
              exported,
              convert_to='mlprogram',
              minimum_deployment_target=ct.target.iOS26,
              skip_model_load=True,
          )
          spec = converted.get_spec()
          assert len(spec.description.input) == 1
          assert len(spec.description.output) == 1
          print('COREML_WINDOW_CONVERSION_OK', flush=True)
          PY
