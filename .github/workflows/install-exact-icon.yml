name: Install exact supplied Clarity icon

on:
  push:
    branches: [neural-ios-port]
    paths:
      - '.github/workflows/install-exact-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-ios-port

      - name: Install exact supplied 1024 icon
        run: |
          set -euo pipefail
          ICON='ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          curl -fL --retry 3 'https://at.adobe.com/2RmtRqVP6FXPA64I' -o "$ICON"
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')" = "1024"

          git add "$ICON"
          if git diff --cached --quiet; then
            echo "Exact icon already installed."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use exact supplied ClarityVideo app icon'
          git push origin HEAD:neural-ios-port
