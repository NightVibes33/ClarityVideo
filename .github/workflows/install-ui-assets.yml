name: Install supplied Clarity UI assets

on:
  push:
    branches: [neural-ios-port]
    paths:
      - '.github/workflows/install-ui-assets.yml'

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-ios-port

      - name: Install exact supplied icon and standalone mountain artwork
        run: |
          set -euo pipefail

          ICON='ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          MOUNTAIN_DIR='ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset'
          mkdir -p "$MOUNTAIN_DIR"

          curl -fL --retry 3 'https://at.adobe.com/50ZN2AYwHUqaIaME' -o "$ICON"
          curl -fL --retry 3 'https://at.adobe.com/nMoXs4010I9Bx9kO' -o "$MOUNTAIN_DIR/MountainReference.png"

          ICON_W="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')"
          ICON_H="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')"
          test "$ICON_W" = "1024"
          test "$ICON_H" = "1024"

          cat > "$MOUNTAIN_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "MountainReference.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          git add "$ICON" "$MOUNTAIN_DIR"
          if git diff --cached --quiet; then
            echo "Assets already match."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Install supplied ClarityVideo icon and mountain artwork'
          git push origin HEAD:neural-ios-port
