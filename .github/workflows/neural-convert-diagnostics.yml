name: Diagnose fixed-shape neural conversion

on:
  workflow_dispatch:
  push:
    branches: [neural-convert-diagnostics]
    paths:
      - '.github/workflows/neural-convert-diagnostics.yml'
      - 'PortTools/**'

permissions:
  contents: read

concurrency:
  group: neural-convert-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' numpy
      - name: Export synthetic graph and validate ranks
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/Mappsnet7/DLSSMac/f47a05b7f11e2d02c43bfa5337984fe2cee546f2/native/python/mlxdlss/weight_spec.json' \
            -o "$RUNNER_TEMP/weight_spec.json"
          PYTHONPATH=PortTools python - <<'PY'
          import json
          import os
          from pathlib import Path
          import torch
          from torch import nn
          from mlxdlss import model as recovered

          spec=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('weight_spec.json').read_text())['tensors']
          weights={}
          for name, entry in spec.items():
              dtype=torch.float16 if entry['dtype']=='F16' else torch.float32
              weights[name]=torch.zeros(tuple(entry['shape']),dtype=dtype)

          class NCHWHead(nn.Module):
              def __init__(self,network):
                  super().__init__()
                  self.network=network
              def forward(self,value):
                  return self.network(value.permute(0,2,3,1)).permute(0,3,1,2)

          network=NCHWHead(recovered.NeuralRenderingModel(weights)).eval()
          example=torch.zeros((1,16,128,128),dtype=torch.float32)

          with torch.inference_mode():
              exported=torch.export.export(network,(example,),strict=True).run_decompositions({})

          nodes=list(exported.graph_module.graph.nodes)
          high=[]
          max_rank=0
          for node in nodes:
              value=node.meta.get('val')
              shape=getattr(value,'shape',None)
              if shape is None:
                  continue
              rank=len(shape)
              max_rank=max(max_rank,rank)
              if rank>5:
                  high.append((node.name,str(node.target),tuple(shape),node.meta.get('stack_trace')))

          print('FX_NODE_COUNT',len(nodes),flush=True)
          print('MAX_TENSOR_RANK',max_rank,flush=True)
          print('RANK_GT_5_COUNT',len(high),flush=True)
          for name,target,shape,stack in high[:80]:
              print('RANKGT5',name,target,shape,flush=True)
              if stack:
                  print('STACK',stack[-900:],flush=True)

          if high:
              raise SystemExit(f'found {len(high)} exported tensors above Core ML rank 5')
          PY
