name: Diagnose fixed-shape neural conversion

on:
  workflow_dispatch:
  push:
    branches: [neural-convert-diagnostics]
    paths:
      - '.github/workflows/neural-convert-diagnostics.yml'
      - 'PortTools/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' numpy
      - name: Build synthetic recovered graph and inspect TorchScript
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/Mappsnet7/DLSSMac/f47a05b7f11e2d02c43bfa5337984fe2cee546f2/native/python/mlxdlss/weight_spec.json' \
            -o "$RUNNER_TEMP/weight_spec.json"
          PYTHONPATH=PortTools python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from torch import nn
          from mlxdlss import model as recovered

          spec=json.loads(Path(__import__('os').environ['RUNNER_TEMP']).joinpath('weight_spec.json').read_text())['tensors']
          weights={}
          for name, entry in spec.items():
              dtype=torch.float16 if entry['dtype']=='F16' else torch.float32
              weights[name]=torch.zeros(tuple(entry['shape']), dtype=dtype)

          class NCHWHead(nn.Module):
              def __init__(self, network):
                  super().__init__()
                  self.network=network
              def forward(self, value):
                  return self.network(value.permute(0,2,3,1)).permute(0,3,1,2)

          example=torch.zeros((1,16,128,128), dtype=torch.float32)
          network=NCHWHead(recovered.NeuralRenderingModel(weights)).eval()

          def report(label, module):
              graph=module.inlined_graph
              nodes=list(graph.nodes())
              ints=[n for n in nodes if n.kind()=='aten::Int']
              nums=[n for n in nodes if n.kind()=='prim::NumToTensor']
              print(f'{label}: nodes={len(nodes)} aten::Int={len(ints)} NumToTensor={len(nums)}', flush=True)
              for n in ints[:8]:
                  inp=n.inputsAt(0)
                  prod=inp.node()
                  print('INT', str(n), 'producer=', prod.kind(), str(prod), flush=True)

          with torch.inference_mode():
              traced=torch.jit.trace(network, example, strict=True, check_trace=False)
              frozen=torch.jit.freeze(traced)
          report('freeze', frozen)

          optimized=torch.jit.optimize_for_inference(frozen)
          report('optimize_for_inference', optimized)

          graph=optimized._c._get_method('forward').graph

          def counts(label, g):
              nodes=list(g.nodes())
              ints=[n for n in nodes if n.kind()=='aten::Int']
              nums=[n for n in nodes if n.kind()=='prim::NumToTensor']
              sizes=[n for n in nodes if n.kind() in ('aten::size','prim::NumToTensor')]
              print(f'{label}: nodes={len(nodes)} aten::Int={len(ints)} NumToTensor={len(nums)} shape_nodes={len(sizes)}',flush=True)
              return ints

          print('available-shape-passes', [
              n for n in dir(torch._C)
              if n.startswith('_jit_pass') and any(k in n for k in ('shape','constant','peephole','propagate'))
          ], flush=True)

          variants=[]

          def clone_graph():
              return optimized._c._get_method('forward').graph.copy()

          for label, runner in [
              ('constant', lambda g: torch._C._jit_pass_constant_propagation(g)),
              ('peephole', lambda g: torch._C._jit_pass_peephole(g, True)),
              ('shape-prop', lambda g: torch._C._jit_pass_propagate_shapes_on_graph(g)),
              ('shape+constant', lambda g: (
                  torch._C._jit_pass_propagate_shapes_on_graph(g),
                  torch._C._jit_pass_constant_propagation(g),
                  torch._C._jit_pass_peephole(g, True),
                  torch._C._jit_pass_dce(g),
              )),
          ]:
              g=clone_graph()
              try:
                  runner(g)
                  variants.append((label,g))
                  counts(label,g)
              except Exception as exc:
                  print('variant-failed',label,repr(exc),flush=True)

          g=clone_graph()
          try:
              torch._C._jit_pass_complete_shape_analysis(g, (example,), False)
              torch._C._jit_pass_constant_propagation(g)
              torch._C._jit_pass_peephole(g, True)
              torch._C._jit_pass_dce(g)
              variants.append(('complete-shape',g))
              counts('complete-shape',g)
          except Exception as exc:
              print('variant-failed complete-shape',repr(exc),flush=True)

          ints=counts('baseline-for-chain',graph)
          for root in ints[:3]:
              print('CHAIN-ROOT',root,flush=True)
              seen=set()
              def walk(value, depth=0):
                  if depth>6 or value.debugName() in seen:
                      return
                  seen.add(value.debugName())
                  producer=value.node()
                  try:
                      typ=value.type()
                      sizes=typ.sizes() if hasattr(typ,'sizes') else None
                  except Exception:
                      typ=value.type()
                      sizes=None
                  print('  '*depth,'VALUE',value.debugName(),'type=',typ,'sizes=',sizes,'producer=',producer.kind(),str(producer),flush=True)
                  for inp in producer.inputs():
                      walk(inp,depth+1)
              walk(root.inputsAt(0))

          with torch.inference_mode():
              exported=torch.export.export(network,(example,),strict=True).run_decompositions({})
          fx_nodes=list(exported.graph_module.graph.nodes)
          print('exported_fx_nodes=',len(fx_nodes),flush=True)
          kinds={}
          for n in fx_nodes:
              target=str(n.target)
              kinds[target]=kinds.get(target,0)+1
          for target,count in sorted(kinds.items(),key=lambda x:-x[1])[:30]:
              print('FX',count,target,flush=True)
          PY
