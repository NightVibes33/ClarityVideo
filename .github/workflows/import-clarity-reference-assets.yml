name: Import Clarity reference assets

on:
  workflow_dispatch:
  push:
    branches: [neural-ios-port]
    paths:
      - '.github/workflows/import-clarity-reference-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-ios-port

      - name: Install exact icon and clean mountain artwork
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 2             'https://at.adobe.com/50ZN2AYwHUqaIaME'             -o ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          mkdir -p ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset
          curl -fL --retry 3 --retry-delay 2             'https://at.adobe.com/nMoXs4010I9Bx9kO'             -o ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png

          cat > ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "MountainReference.png",
                "idiom" : "universal",
                "scale" : "1x"
              },
              {
                "idiom" : "universal",
                "scale" : "2x"
              },
              {
                "idiom" : "universal",
                "scale" : "3x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          python3 - <<'PY'
          from PIL import Image
          icon=Image.open('ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          mountain=Image.open('ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png')
          assert icon.size == (1024,1024), icon.size
          assert mountain.width > 0 and mountain.height > 0
          print('icon', icon.size, 'mountain', mountain.size)
          PY

          rm -f .github/workflows/import-clarity-reference-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png             ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset             .github/workflows/import-clarity-reference-assets.yml

          if git diff --cached --quiet; then
            echo 'No asset changes required.'
            exit 0
          fi

          git commit -m 'Install exact ClarityVideo icon and clean mountain artwork'
          git push origin HEAD:neural-ios-port
