name: Sync supplied Clarity brand assets

on:
  push:
    branches: [neural-ios-port]
    paths:
      - '.github/workflows/sync-brand-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-ios-port

      - name: Install supplied app icon and decorative mountain asset
        run: |
          set -euo pipefail

          curl -fL --retry 3 'https://at.adobe.com/50ZN2AYwHUqaIaME' \
            -o ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          mkdir -p ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset
          curl -fL --retry 3 'https://at.adobe.com/nMoXs4010I9Bx9kO' \
            -o ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png

          cat > ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "MountainReference.png",
                "idiom" : "universal",
                "scale" : "1x"
              },
              {
                "idiom" : "universal",
                "scale" : "2x"
              },
              {
                "idiom" : "universal",
                "scale" : "3x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          file ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          file ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png

          git config user.name 'Clarity CI'
          git config user.email 'actions@github.com'
          git add ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
                  ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset
          if git diff --cached --quiet; then
            echo 'Brand assets already match.'
            exit 0
          fi
          git commit -m 'Install supplied ClarityVideo icon and mountain artwork'
          git push origin HEAD:neural-ios-port
