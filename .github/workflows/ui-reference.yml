name: Verify native Clarity reference UI
# Native UI verification includes the supplied production icon and standalone mountain asset.

on:
  workflow_dispatch:
  push:
    branches: [temp-appstore-ui-final]
    paths:
      - 'ClarityVideo/Views/**'
      - 'ClarityVideo/Models/Models.swift'
      - 'ClarityVideo/Resources/Assets.xcassets/ReferenceArtwork.imageset/**'
      - 'ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/**'
      - 'ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/**'
      - 'ClarityVideo/Resources/PrivacyInfo.xcprivacy'
      - 'ClarityVideo.xcodeproj/project.pbxproj'
      - '.github/workflows/ui-reference.yml'

permissions:
  contents: read

concurrency:
  group: clarity-native-reference-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          SELECTED="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -Vr | head -1)"
          test -n "$SELECTED"
          sudo xcode-select --switch "$SELECTED/Contents/Developer"

      - name: Verify native implementation and supplied brand assets
        run: |
          set -euo pipefail

          test ! -d ClarityVideo/Resources/Assets.xcassets/ReferenceArtwork.imageset

          if grep -R -E 'ExactHotspot|ExactReferenceBackground|ReferenceArtwork' ClarityVideo/Views; then
            echo "Poster-backed or hotspot UI implementation detected."
            exit 1
          fi

          grep -q 'LazyVGrid' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'VideoPlayer' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'Toggle' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'Slider' ClarityVideo/Views/ReferenceScreens.swift

          test "$(git hash-object ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png)" = "5df3af193b356981869fcabfa36faf5a978df149"
          test "$(git hash-object ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png)" = "a8fb84ef58e112d8ff9c6210285c81cd5a28db65"

          test "$(sips -g pixelWidth ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelHeight/ {print $2}')" = "1024"

      - name: Verify App Store privacy manifest
        run: |
          set -euo pipefail
          test -s ClarityVideo/Resources/PrivacyInfo.xcprivacy
          plutil -lint ClarityVideo/Resources/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyAccessedAPICategoryDiskSpace' ClarityVideo/Resources/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyAccessedAPICategoryFileTimestamp' ClarityVideo/Resources/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' ClarityVideo/Resources/PrivacyInfo.xcprivacy

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ClarityVideo.xcodeproj -scheme ClarityVideo             -sdk iphonesimulator -configuration Release             -derivedDataPath "$RUNNER_TEMP/UIReference"             CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/UIReference/Build/Products/Release-iphonesimulator/ClarityVideo.app"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"

      - name: Capture all reference screens
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-reference

          # Use a fresh simulator owned by this workflow. Reusing a pre-created
          # hosted-runner device occasionally leaves simctl blocked behind
          # LaunchServices migration and makes screenshot QA fail randomly.
          python3 - <<'PY' > "$RUNNER_TEMP/clarity-simulator.txt"
          import json, subprocess

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "available", "-j"])
          )["runtimes"]
          ios = [
              r for r in runtimes
              if r.get("isAvailable", True)
              and "SimRuntime.iOS-" in r.get("identifier", "")
          ]
          if not ios:
              raise SystemExit("No available iOS simulator runtime")

          def version_key(runtime):
              version = str(runtime.get("version", "0"))
              return tuple(int(part) if part.isdigit() else 0 for part in version.split("."))

          runtime = sorted(ios, key=version_key, reverse=True)[0]

          device_types = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"])
          )["devicetypes"]
          iphones = [d for d in device_types if d.get("name", "").startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator device type")

          preferred = next(
              (d for d in iphones if d.get("name") in {"iPhone 17 Pro", "iPhone 17"}),
              iphones[0]
          )
          print(preferred["identifier"])
          print(runtime["identifier"])
          PY

          DEVICE_TYPE="$(sed -n '1p' "$RUNNER_TEMP/clarity-simulator.txt")"
          RUNTIME="$(sed -n '2p' "$RUNNER_TEMP/clarity-simulator.txt")"
          test -n "$DEVICE_TYPE"
          test -n "$RUNTIME"

          DEVICE="$(xcrun simctl create "Clarity-QA-$GITHUB_RUN_ID" "$DEVICE_TYPE" "$RUNTIME")"
          test -n "$DEVICE"
          cleanup_simulator() {
            xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true
            xcrun simctl delete "$DEVICE" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT

          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$RUNNER_TEMP/UIReference/Build/Products/Release-iphonesimulator/ClarityVideo.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # Keep system privacy sheets out of visual QA. Import behavior itself
          # is covered by the app's real PHPhotoLibrary code path.
          xcrun simctl privacy "$DEVICE" grant photos com.nightvibes33.clarityvideo || true
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          # Capture Import last. Its simulator-only fixture exercises the exact
          # native layout without invoking the Photos permission UI.
          for route in onboarding home enhance export storage processing processing-confirm results results-confirm import settings diagnostics diagnostics-actions diagnostics-confirm projects; do
            echo "Capturing $route"
            ROUTE="$route" DEVICE="$DEVICE" python3 - <<'PY'
          import os, subprocess, sys, time
          route = os.environ["ROUTE"]
          device = os.environ["DEVICE"]
          env = os.environ.copy()
          env["SIMCTL_CHILD_CLARITY_UI_ROUTE"] = route
          env["SIMCTL_CHILD_CLARITY_UI_SNAPSHOT"] = "1"

          try:
              subprocess.run(
                  ["xcrun", "simctl", "terminate", device, "com.nightvibes33.clarityvideo"],
                  check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=5
              )
          except subprocess.TimeoutExpired:
              # Simulator shutdown can stall during first-boot migration. A stale
              # process is harmless because the following launch replaces the route.
              pass

          for attempt in range(2):
              try:
                  subprocess.run(
                      ["xcrun", "simctl", "launch", "--terminate-running-process", device, "com.nightvibes33.clarityvideo"],
                      env=env, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT, timeout=60
                  )
                  break
              except subprocess.TimeoutExpired:
                  if attempt == 1:
                      print(f"launch timed out twice for {route}", file=sys.stderr)
                      raise
                  print(f"launch timed out for {route}; retrying once", file=sys.stderr)
                  try:
                      subprocess.run(
                          ["xcrun", "simctl", "terminate", device, "com.nightvibes33.clarityvideo"],
                          check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=5
                      )
                  except subprocess.TimeoutExpired:
                      pass
                  time.sleep(2)

          time.sleep(2)
          screenshot = f"artifacts/ui-reference/{route}.png"
          for shot_attempt in range(3):
              try:
                  subprocess.run(
                      ["xcrun", "simctl", "io", device, "screenshot", screenshot],
                      check=True, timeout=30
                  )
                  break
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                  if shot_attempt == 2:
                      print(f"screenshot failed three times for {route}", file=sys.stderr)
                      raise
                  print(f"screenshot stalled for {route}; retrying", file=sys.stderr)
                  time.sleep(3)
          print(f"captured {route}")
          PY
          done

          test -s artifacts/ui-reference/onboarding.png
          test -s artifacts/ui-reference/home.png
          test -s artifacts/ui-reference/import.png
          test -s artifacts/ui-reference/enhance.png
          test -s artifacts/ui-reference/export.png
          test -s artifacts/ui-reference/storage.png
          test -s artifacts/ui-reference/processing.png
          test -s artifacts/ui-reference/processing-confirm.png
          test -s artifacts/ui-reference/results.png
          test -s artifacts/ui-reference/results-confirm.png
          test -s artifacts/ui-reference/settings.png
          test -s artifacts/ui-reference/diagnostics.png
          test -s artifacts/ui-reference/diagnostics-actions.png
          test -s artifacts/ui-reference/diagnostics-confirm.png
          test -s artifacts/ui-reference/projects.png

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-reference-ui-snapshots
          path: artifacts/ui-reference
          retention-days: 7
