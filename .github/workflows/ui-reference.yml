name: Verify native Clarity reference UI
# Native UI verification includes the supplied production icon and standalone mountain asset.

on:
  workflow_dispatch:
  push:
    branches: [neural-ios-port]
    paths:
      - 'ClarityVideo/Views/**'
      - 'ClarityVideo/App/AppState.swift'
      - 'ClarityVideo/Resources/Assets.xcassets/ReferenceArtwork.imageset/**'
      - 'ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/**'
      - 'ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/**'
      - 'ClarityVideo.xcodeproj/project.pbxproj'
      - '.github/workflows/ui-reference.yml'

permissions:
  contents: read

concurrency:
  group: clarity-native-reference-ui-v2
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          SELECTED="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -Vr | head -1)"
          test -n "$SELECTED"
          sudo xcode-select --switch "$SELECTED/Contents/Developer"

      - name: Verify native implementation and supplied brand assets
        run: |
          set -euo pipefail

          test ! -d ClarityVideo/Resources/Assets.xcassets/ReferenceArtwork.imageset

          if grep -R -E 'ExactHotspot|ExactReferenceBackground|ReferenceArtwork' ClarityVideo/Views; then
            echo "Poster-backed or hotspot UI implementation detected."
            exit 1
          fi

          grep -q 'LazyVGrid' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'VideoPlayer' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'Toggle' ClarityVideo/Views/ReferenceScreens.swift
          grep -q 'Slider' ClarityVideo/Views/ReferenceScreens.swift

          test "$(git hash-object ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png)" = "5df3af193b356981869fcabfa36faf5a978df149"
          test "$(git hash-object ClarityVideo/Resources/Assets.xcassets/MountainReference.imageset/MountainReference.png)" = "a8fb84ef58e112d8ff9c6210285c81cd5a28db65"

          test "$(sips -g pixelWidth ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight ClarityVideo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelHeight/ {print $2}')" = "1024"

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ClarityVideo.xcodeproj -scheme ClarityVideo             -sdk iphonesimulator -configuration Release             -derivedDataPath "$RUNNER_TEMP/UIReference"             CODE_SIGNING_ALLOWED=NO build

      - name: Capture all reference screens
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-reference
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$RUNNER_TEMP/UIReference/Build/Products/Release-iphonesimulator/ClarityVideo.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # Keep system privacy sheets out of visual QA. Import behavior itself
          # is covered by the app's real PHPhotoLibrary code path.
          xcrun simctl privacy "$DEVICE" grant photos com.nightvibes33.clarityvideo || true
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          # Capture Import last. Its simulator-only fixture exercises the exact
          # native layout without invoking the Photos permission UI.
          for route in home enhance export import; do
            echo "Capturing $route"
            ROUTE="$route" DEVICE="$DEVICE" python3 - <<'PY'
          import os, subprocess, sys, time
          route = os.environ["ROUTE"]
          device = os.environ["DEVICE"]
          env = os.environ.copy()
          env["SIMCTL_CHILD_CLARITY_UI_ROUTE"] = route
          env["SIMCTL_CHILD_CLARITY_UI_SNAPSHOT"] = "1"

          subprocess.run(
              ["xcrun", "simctl", "terminate", device, "com.nightvibes33.clarityvideo"],
              check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=10
          )

          for attempt in range(2):
              try:
                  subprocess.run(
                      ["xcrun", "simctl", "launch", device, "com.nightvibes33.clarityvideo"],
                      env=env, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT, timeout=45
                  )
                  break
              except subprocess.TimeoutExpired:
                  if attempt == 1:
                      print(f"launch timed out twice for {route}", file=sys.stderr)
                      raise
                  print(f"launch timed out for {route}; retrying once", file=sys.stderr)
                  subprocess.run(
                      ["xcrun", "simctl", "terminate", device, "com.nightvibes33.clarityvideo"],
                      check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=10
                  )
                  time.sleep(2)

          time.sleep(2)
          subprocess.run(
              ["xcrun", "simctl", "io", device, "screenshot", f"artifacts/ui-reference/{route}.png"],
              check=True, timeout=20
          )
          print(f"captured {route}")
          PY
          done

          test -s artifacts/ui-reference/home.png
          test -s artifacts/ui-reference/import.png
          test -s artifacts/ui-reference/enhance.png
          test -s artifacts/ui-reference/export.png

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-reference-ui-snapshots
          path: artifacts/ui-reference
          retention-days: 7
